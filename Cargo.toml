[package]
name = "hello"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A starter Rust native application for Xila."
license = "MIT"
publish = false

[features]
guest = ["dep:xila-sys"]

[dependencies]
xila-sys = { git = "https://github.com/xila-project/core", rev = "457d1a15eaecfb8c774e25825d86c321a39ba592", optional = true, features = [
  "link",
] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
