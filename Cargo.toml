[package]
name = "hello"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A starter Rust native application for Xila."
license = "MIT"
publish = false

[features]
# Loadable static-PIE ELF for the native loader. Mutually exclusive with `linked`:
# `xila-sys` rejects enabling its `link` and `linked` features together.
guest = ["dep:xila-sys", "xila-sys/link"]
# Statically linked into the firmware, mounted with `xila::executable::linked_executable!`.
linked = ["dep:xila-sys", "xila-sys/linked"]

[dependencies]
xila-sys = { git = "https://github.com/xila-project/core", rev = "ac18ac3401b55289da50204ac297c7178b194695", optional = true }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
